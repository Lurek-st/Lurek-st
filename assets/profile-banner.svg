<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Chengyang Lu / Lurek Lu</title>
  <desc id="desc">
    Industrial Robotics, AI Agents, and Reproducible Engineering
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111C2D"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#2F81F7"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path
        d="M 36 0 L 0 0 0 36"
        fill="none"
        stroke="#58A6FF"
        stroke-width="1"
        opacity="0.07"
      />
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>

  <!-- Left identity accent -->
  <rect x="64" y="62" width="5" height="176" rx="2.5" fill="url(#accent)"/>

  <text
    x="96"
    y="118"
    fill="#F0F6FC"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="46"
    font-weight="700"
    letter-spacing="0.5"
  >
    CHENGYANG LU / LUREK LU
  </text>

  <text
    x="98"
    y="162"
    fill="#8C959F"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="21"
    font-weight="500"
    letter-spacing="1.2"
  >
    INDUSTRIAL ROBOTICS · AI AGENTS · REPRODUCIBLE ENGINEERING
  </text>

  <text
    x="98"
    y="205"
    fill="#58A6FF"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="17"
    font-weight="500"
    letter-spacing="0.7"
  >
    CityUHK (Dongguan) · Intelligent Manufacturing Engineering
  </text>

  <!-- Kinematic-chain motif -->
  <g
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M 860 205 L 912 160 L 970 181 L 1026 116 L 1091 145"
      stroke="#58A6FF"
      stroke-width="4"
      opacity="0.78"
    />

    <circle cx="860" cy="205" r="11" fill="#0D1117" stroke="#58A6FF" stroke-width="3"/>
    <circle cx="912" cy="160" r="10" fill="#0D1117" stroke="#58A6FF" stroke-width="3"/>
    <circle cx="970" cy="181" r="10" fill="#0D1117" stroke="#58A6FF" stroke-width="3"/>
    <circle cx="1026" cy="116" r="10" fill="#0D1117" stroke="#58A6FF" stroke-width="3"/>
    <circle cx="1091" cy="145" r="9" fill="#58A6FF"/>
  </g>

  <!-- Coordinate frame -->
  <g
    font-family="Segoe UI, Arial, sans-serif"
    font-size="13"
    font-weight="600"
  >
    <line x1="1026" y1="116" x2="1074" y2="116" stroke="#FF7B72" stroke-width="2.5"/>
    <line x1="1026" y1="116" x2="1026" y2="70" stroke="#3FB950" stroke-width="2.5"/>
    <line x1="1026" y1="116" x2="995" y2="143" stroke="#D2A8FF" stroke-width="2.5"/>

    <text x="1080" y="121" fill="#FF7B72">X</text>
    <text x="1021" y="61" fill="#3FB950">Y</text>
    <text x="979" y="154" fill="#D2A8FF">Z</text>
  </g>

  <!-- Sparse validation nodes -->
  <g fill="#8C959F" opacity="0.55">
    <circle cx="822" cy="86" r="3"/>
    <circle cx="855" cy="108" r="3"/>
    <circle cx="895" cy="82" r="3"/>
    <circle cx="934" cy="105" r="3"/>
    <circle cx="1120" cy="202" r="3"/>
    <circle cx="1088" cy="223" r="3"/>
  </g>

  <text
    x="1095"
    y="250"
    text-anchor="end"
    fill="#6E7681"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="12"
    letter-spacing="1.3"
  >
    BUILD · TEST · VALIDATE
  </text>
</svg>
